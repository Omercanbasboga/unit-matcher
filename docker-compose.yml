# Postgres and MongoDB for local runs. The matcher itself runs on the host.
# Both read the same .env as the scripts; the passwords must not be empty.
#
#   docker compose up -d
#   docker compose down        # keeps the volumes
#   docker compose down -v     # removes the data too

services:
  db:
    image: postgres:16-alpine
    container_name: unit_matcher_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE:-unit_matcher}
      POSTGRES_USER: ${PGUSER:-postgres}
      POSTGRES_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    ports:
      - "${PGPORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PGUSER:-postgres} -d ${PGDATABASE:-unit_matcher}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: unit_matcher_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-unit_matcher}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  mongodata:
